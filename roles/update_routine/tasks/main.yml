---
- name: Prüfen, ob Go bereits vorhanden ist
  ansible.builtin.command:
    cmd: /usr/local/go/bin/go version
  register: check_go
  failed_when: false
  changed_when: false

- name: Go (Golang) direkt herunterladen und entpacken (falls nicht vorhanden)
  ansible.builtin.shell: |
    curl -sL https://go.dev/dl/go1.22.0.linux-amd64.tar.gz -o /tmp/go.tar.gz
    rm -rf /usr/local/go
    tar -C /usr/local -xzf /tmp/go.tar.gz
    rm /tmp/go.tar.gz
  when: check_go.rc != 0

- name: Go-Runner Quellcode übertragen
  ansible.builtin.copy:
    src: runner.go
    dest: /tmp/runner.go
    mode: '0644'

- name: Go-Runner kompilieren (statische Binärdatei)
  ansible.builtin.command:
    cmd: /usr/local/go/bin/go build -o /usr/local/bin/silverblue-update /tmp/runner.go
    creates: /usr/local/bin/silverblue-update

- name: Eigentümer auf root setzen und SUID-Bit aktivieren
  ansible.builtin.file:
    path: /usr/local/bin/silverblue-update
    owner: root
    group: root
    mode: '4755'

- name: Persistentes Verzeichnis in /var/local für das Icon erstellen
  ansible.builtin.file:
    path: /var/local/share/icons
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Icon sicher nach /var/local/share/icons kopieren
  ansible.builtin.copy:
    src: updateico.svg
    dest: /var/local/share/icons/silverblue-update.svg
    owner: root
    group: root
    mode: '0644'

- name: Globales Desktop-Icon mit absolutem Pfad nach /var/local erstellen
  ansible.builtin.copy:
    content: |
      [Desktop Entry]
      Name=System Update
      Comment=Aktualisiert das System via Ansible
      Exec=/usr/local/bin/silverblue-update
      Icon=/var/local/share/icons/silverblue-update.svg
      Terminal=true
      Type=Application
      Categories=System;
    dest: /usr/local/share/applications/silverblue-update.desktop
    owner: root
    group: root
    mode: '0644'

- name: Desktop-Datenbank aktualisieren
  ansible.builtin.command:
    cmd: update-desktop-database /usr/local/share/applications
  changed_when: false
  ignore_errors: true
