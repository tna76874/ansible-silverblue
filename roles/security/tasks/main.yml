---
- name: Sicherstellen, dass firewalld aktiv und aktiviert ist
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Standard-Zone auf DROP setzen
  ansible.posix.firewalld:
    zone: public
    target: DROP
    state: present
    permanent: true

- name: Ausnahmen aus globalen Variablen erlauben
  ansible.posix.firewalld:
    port: "{{ item }}"
    zone: public
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_allowed_ports }}"